name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Honors rust-toolchain.toml at the repo root.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Populate the dependency cache once so the --offline runs below
      # don't fail on a cold target directory.
      - run: cargo fetch --locked

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked --offline
