[package]
name = "ap-build"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ap-core = { version = "0.1.0", path = "../core" }
ap-ecosystem = { version = "0.1.0", path = "../ecosystem" }
diff = "0.1.13"
flate2 = "1.0"
hex = "0.4.3"
indicatif = "0.18.6"
libc = "0.2"
lzma-rust2 = { version = "0.16", default-features = false, features = ["std", "xz"] }
pep440_rs = "0.7.3"
regex = { version = "1.13.1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4"
tempfile = "3.27.0"
toml = "1.1.5"
thiserror = "2.0.20"
tracing = "0.1.44"
ureq = "3.4.1"
urlencoding = "2.1"
walkdir = "2"
zstd = "0.13"
quick-xml = "0.42"

[dev-dependencies]
color-eyre = "0.6.5"
lzma-rust2 = "0.16"
zip = { version = "6", default-features = false, features = ["deflate"] }
