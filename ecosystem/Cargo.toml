[package]
name = "ap-ecosystem"
version.workspace = true
edition.workspace = true
license.workspace = true

[dev-dependencies]
tempfile = "3"

[dependencies]
ap-core = { version = "0.1.0", path = "../core" }
bzip2 = "0.6"
flate2 = "1.1.10"
hex = "0.4.3"
